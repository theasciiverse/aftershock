// Aftershock default settings: made for the keyboard first.
// Your own changes are saved in config.cfg in the state folder.
unbindall

// move: arrows or WASD; Shift walks slowly (you always run)
bind UPARROW    +forward
bind DOWNARROW  +back
bind LEFTARROW  +left
bind RIGHTARROW +right
bind w          +forward
bind s          +back
bind a          +moveleft
bind d          +moveright
bind ,          +moveleft
bind .          +moveright
bind LALT       +strafe
bind RALT       +strafe
bind LSHIFT     +speed
bind RSHIFT     +speed
bind SPACE      +jump
bind e          +moveup
bind c          +movedown

// fire: Ctrl, F or Enter
bind LCTRL      +attack
bind RCTRL      +attack
bind f          +attack
bind ENTER      +attack
bind MOUSE1     +attack
bind MOUSE2     +jump

// look: Page Up and Page Down, End or V to look ahead again
bind PGUP       +lookup
bind PGDN       +lookdown
bind END        centerview
bind v          centerview
bind HOME       centerview

// weapons
bind 1 "impulse 1"
bind 2 "impulse 2"
bind 3 "impulse 3"
bind 4 "impulse 4"
bind 5 "impulse 5"
bind 6 "impulse 6"
bind 7 "impulse 7"
bind 8 "impulse 8"
bind q          "impulse 10"
bind ]          "impulse 10"
bind [          "impulse 12"
bind MWHEELUP   "impulse 10"
bind MWHEELDOWN "impulse 12"

// game
bind ESCAPE     togglemenu
bind `          toggleconsole
bind ~          toggleconsole
bind '          toggleconsole
bind TAB        +showscores
bind p          pause
bind PAUSE      pause
bind F1         help
bind F2         menu_save
bind F3         menu_load
bind F4         menu_options
bind F6         "echo Saved; save quick"
bind F9         "echo Loading; load quick"
bind +          sizeup
bind =          sizeup
bind -          sizedown

// always run; Shift slows you down
cl_forwardspeed 400
cl_backspeed 400
cl_sidespeed 350
cl_movespeedkey 0.5
cl_yawspeed 220
cl_anglespeedkey 0.6
cl_pitchspeed 120
lookspring 0
lookstrafe 0
sensitivity 3
+mlook

// aim help: the game lifts your shots onto what you face
sv_aim 0.93

crosshair 1
gamma 0.8
volume 0.7
registered 1

name "Wanderer"
topcolor 11
bottomcolor 10

// the FitzQuake network protocol: LibreQuake's big maps need more than 256 models
sv_protocol 666
